<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Scegli il tuo strumento</title>
    <link rel="icon" type="image/png" href="logo-doppio-cerchio.png">
    <link rel="apple-touch-icon" href="logo-doppio-cerchio.png">
    <style>
        * {
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        html {
            animation: fadeIn 0.35s ease;
        }

        html.fade-out {
            animation: fadeOut 0.25s ease forwards;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, "Segoe UI", Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, #f6f1f8 0%, #eee7f1 45%, #e4dbe9 100%);
            color: #2c2430;
            text-align: center;
            padding: 40px 20px;
        }

        .card {
            max-width: 560px;
            width: 100%;
        }

        #logo {
            max-width: 280px;
            width: 100%;
            filter: drop-shadow(0 8px 16px rgba(106, 26, 124, 0.15));
        }

        h1 {
            margin: 40px 0 36px;
            font-size: 1.6em;
            font-weight: 600;
            color: #3d1f47;
        }

        .button-container {
            display: flex;
            gap: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .styled-button {
            display: inline-block;
            padding: 15px 38px;
            font-size: 1.1em;
            font-weight: 500;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #7c2690, #5a1567);
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(106, 26, 124, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .styled-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(106, 26, 124, 0.38);
        }

        #ge-button {
            background: linear-gradient(135deg, #a85fc0, #7c2690);
        }

        hr {
            border: none;
            border-top: 1px solid #d9cfdd;
            margin: 48px 0 20px;
        }

        .footer-text {
            font-size: 0.8em;
            color: #948a97;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="logo-target.png" id="logo" alt="Logo Target">

        <h1>Scegli lo strumento da utilizzare</h1>

        <div class="button-container">
            <a href="target-t2t.html" class="styled-button">Target for T2T</a>
            <a href="target-ge.html" id="ge-button" class="styled-button">Target for GE</a>
        </div>

        <hr>
        <p class="footer-text">
            Questo progetto è un'idea del Dott. Andrea Lotesoriere.<br>
            È attualmente in corso uno studio di validazione presso l'Università di Ferrara.<br>
            Tutti i diritti riservati.
        </p>
    </div>

    <script>
        document.querySelectorAll('a[href$=".html"]').forEach(function (link) {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const dest = this.getAttribute('href');
                document.documentElement.classList.add('fade-out');
                setTimeout(function () {
                    window.location.href = dest;
                }, 220);
            });
        });
    </script>

</body>
</html>
